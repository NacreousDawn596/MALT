name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: test (NixOS / Octave)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Full test suite (incl. Octave differential, hard-required)
        run: MALT_REQUIRE_OCTAVE=1 nix develop -c pytest -q

      - name: Lint
        run: nix develop -c ruff check .

      - name: Type check
        run: nix develop -c mypy src/malt

      - name: Nix flake check
        run: nix flake check

      - name: Headless graphics smoke test
        run: |
          MPLBACKEND=Agg nix develop -c python -m malt run examples/graphics/sine_plot.m

  benchmark:
    name: benchmark (informational, non-blocking)
    runs-on: ubuntu-latest
    # Benchmarks are not a hard gate: they are informational only.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Run benchmarks
        run: nix develop -c python benchmarks/run.py --quick
